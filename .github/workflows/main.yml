name: Ruby

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / AR ${{ matrix.activerecord }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3']
        activerecord: ['7.0', '7.1', '7.2', '8.0']
    env:
      BUNDLE_GEMFILE: gemfiles/ar_${{ matrix.activerecord }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec standardrb
